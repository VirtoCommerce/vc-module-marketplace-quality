name: vcmp_get_offers_for_quality
description: |
  Get seller offers by their IDs with all their data, to evaluate their quality.
  Returns the complete offers as the marketplace stores them: id, sellerProductId, name, sku, productType,
  state flags (isActive, isDefault, isSuspended), availability dates, inventory (total and per warehouse),
  price lists with their price tiers, properties (including the "Variation" properties that distinguish
  offers of the same product), images, and, when present, the master catalog data behind the offer
  (variationData - the variation the offer is published to, mainProductData - the main product).
require_approval: false

parameters:
  type: object
  properties:
    objectIds:
      type: array
      items:
        type: string
        description: Offer ID
      description: IDs of the offers to load (required)
    take:
      type: integer
      default: 20
      minimum: 1
      maximum: 100
      description: Number of records to return - set it to the number of offer IDs
  required:
    - objectIds

execution:
  endpoint: /api/vcmp/seller/offers/search
  method: POST
  mappings:
    request:
      body:
        objectIds: "{{objectIds}}"
        take: "{{take}}"
    response:
      items: results
      totalCount: totalCount

permission:
  - seller:resources

tags:
  - marketplace
  - offers
  - quality
  - read
