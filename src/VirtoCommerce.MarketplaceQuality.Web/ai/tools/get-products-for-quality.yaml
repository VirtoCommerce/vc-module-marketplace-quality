name: vcmp_get_products_for_quality
description: |
  Get seller products by their IDs with all their data, to evaluate their quality.
  Returns the complete seller products as the marketplace stores them: the seller product fields
  (id, name, code, status, isPublished, hasStagedChanges, publicationRequests, ...) and productData -
  the full catalog product with descriptions (reviews), properties, images, assets, SEO info, GTIN, category and more.
require_approval: false

parameters:
  type: object
  properties:
    objectIds:
      type: array
      items:
        type: string
        description: Seller product ID
      description: IDs of the seller products to load (required)
    take:
      type: integer
      default: 20
      minimum: 1
      maximum: 100
      description: Number of records to return - set it to the number of seller product IDs
  required:
    - objectIds

execution:
  endpoint: /api/vcmp/seller/products/search
  method: POST
  mappings:
    request:
      body:
        objectIds: "{{objectIds}}"
        take: "{{take}}"
    response:
      items: results
      totalCount: totalCount

permission:
  - seller:resources

tags:
  - marketplace
  - products
  - quality
  - read
