name: vcmp_get_quality_target_names
description: |
  Get the names of the quality targets available on the marketplace.
  Only these targets may be used to evaluate seller products: get all targets with
  `vc_catalog_search_quality_targets`, then keep only the ones whose `name` is in this list.
  An empty list means no quality targets are available on the marketplace.
require_approval: false

parameters:
  type: object
  properties: {}
  required: []

execution:
  endpoint: /api/vcmp/quality/target/names
  method: GET
  mappings:
    response:
      names: "$"

#permission:
#  - catalog-quality:read

tags:
  - marketplace
  - quality
  - evaluation
  - read
