name: vcmp_get_seller_product
description: |
  Get a seller product by its ID.
  Returns id, name, code, status and stagedProductDataId - the ID of the staged catalog product (the seller's editable draft) behind the seller product.
require_approval: false

parameters:
  type: object
  properties:
    productId:
      type: string
      description: Seller product ID (required)
  required:
    - productId

execution:
  endpoint: /api/vcmp/seller/products/{productId}
  method: GET
  mappings:
    response:
      id: "$.id"
      name: "$.name"
      code: "$.code"
      status: "$.status"
      stagedProductDataId: "$.stagedProductDataId"

permission:
  - seller:resources

tags:
  - marketplace
  - products
  - read
